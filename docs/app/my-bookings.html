<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - Haris Car Care</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="assets/common/variables.css?v=4" rel="stylesheet">
    <link href="assets/common/base.css?v=4" rel="stylesheet">
    <link href="assets/component/navbar/navbar.css?v=4" rel="stylesheet">
    <link href="assets/component/sidebar/sidebar.css?v=4" rel="stylesheet">
    <link href="assets/component/chatbot/chatbot.css?v=4" rel="stylesheet">
    <link href="assets/account/bookings/bookings.css?v=4" rel="stylesheet">
    <link href="assets/demo.css?v=4" rel="stylesheet">
</head>
<body>

<div data-slot="sidebar"></div>

<div class="main-content">
    <header class="page-header">
        <h1><i class="fa-solid fa-calendar-check"></i> My Bookings</h1>
    </header>

    <main class="page-container">

        <div id="flash"></div>

        <div class="content-card">
            <div class="card-header">
                <i class="fa-solid fa-hourglass-half" style="color: var(--primary);"></i>
                <h3>Upcoming Appointments</h3>
            </div>
            <div class="booking-list" id="upcoming-list"></div>
        </div>

        <div class="content-card" style="margin-top: 2rem;">
            <div class="card-header">
                <i class="fa-solid fa-history" style="color: #666;"></i>
                <h3>Past Appointments</h3>
            </div>
            <div class="booking-list" id="past-list"></div>
        </div>
    </main>
</div>

<div data-slot="chatbot"></div>

<script src="js/seed.js?v=4"></script>
<script src="js/store.js?v=4"></script>
<script src="js/ui.js?v=4"></script>
<script>
  if (UI.mount({ shell: 'account', active: 'bookings', guard: 'user' })) {
    UI.showPendingFlash('#flash');

    const upcoming = Store.upcomingBookings();
    const past = Store.pastBookings();

    const upcomingList = document.getElementById('upcoming-list');
    const pastList = document.getElementById('past-list');

    if (upcoming.length === 0) {
      upcomingList.innerHTML = `
        <div style="padding:2rem;text-align:center;color:#666">
          <p>No upcoming appointments.</p>
          <a href="services.html" class="btn btn-primary" style="margin-top:10px">Book Now</a>
        </div>`;
    } else {
      upcomingList.innerHTML = upcoming.map((booking) => `
        <div class="booking-card">
          <div class="booking-card-icon"><i class="fa-solid fa-car"></i></div>
          <div class="booking-card-details">
            <h4>${UI.escape(booking.serviceNames)}</h4>
            <p>${UI.escape(booking.vehicleDescription)}</p>
          </div>
          <div class="booking-card-datetime">
            <span class="date">${UI.date(booking.bookingDate)}</span>
            <span class="time">${UI.time(booking.bookingDate)}</span>
          </div>
          <div class="booking-card-status ${booking.status === 'PENDING' ? 'status-upcoming' : 'status-completed'}">
            ${UI.escape(booking.status)}
          </div>
          <div class="booking-card-actions">
            <a class="booking-action-btn btn-secondary" href="invoices.html">
              <i class="fa-solid fa-file-invoice"></i> Invoices
            </a>
          </div>
        </div>`).join('');
    }

    if (past.length === 0) {
      pastList.innerHTML = `
        <div style="padding:2rem;text-align:center;color:#666"><p>No past booking history.</p></div>`;
    } else {
      pastList.innerHTML = past.map((booking) => `
        <div class="booking-card" style="opacity:0.8">
          <div class="booking-card-icon" style="background:#e0e0e0;color:#666">
            <i class="fa-solid fa-check"></i>
          </div>
          <div class="booking-card-details">
            <h4>${UI.escape(booking.serviceNames)}</h4>
            <p>${UI.escape(booking.vehicleDescription)}</p>
          </div>
          <div class="booking-card-datetime">
            <span class="date">${UI.date(booking.bookingDate)}</span>
          </div>
          <div class="booking-card-status status-completed">${UI.escape(booking.status)}</div>
          <div class="booking-card-actions">
            <a class="booking-action-btn btn-primary" href="services.html">
              <i class="fa-solid fa-rotate-right"></i> Book Again
            </a>
            <a class="booking-action-btn btn-secondary" href="invoices.html">
              <i class="fa-solid fa-file-invoice"></i> Invoices
            </a>
          </div>
        </div>`).join('');
    }
  }
</script>
</body>
</html>
