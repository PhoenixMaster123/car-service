<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Haris Car Care</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link href="assets/common/variables.css?v=4" rel="stylesheet">
    <link href="assets/common/base.css?v=4" rel="stylesheet">
    <link href="assets/auth/auth-layout.css?v=4" rel="stylesheet">
    <link href="assets/demo.css?v=4" rel="stylesheet">
</head>
<body>

<div class="standalone-theme-toggle theme-toggle" id="theme-toggle">
    <i class="fa-solid fa-sun"></i>
    <i class="fa-solid fa-moon"></i>
    <div class="toggle-circle"></div>
</div>

<main class="auth-wrapper">
    <div class="auth-container">
        <a href="home.html" class="brand-name">Haris Car Care</a>
        <h2>Create Account</h2>

        <div id="flash"></div>

        <form id="registerForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required minlength="8">
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required minlength="8">
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree with the <a href="#">Terms &amp; Conditions</a></label>
            </div>

            <button type="submit" class="submit-btn">Register</button>

            <div class="auth-switch-link">
                Already have an account?
                <a href="index.html">Sign In</a>
            </div>
        </form>
    </div>
</main>

<script src="js/seed.js?v=4"></script>
<script src="js/store.js?v=4"></script>
<script src="js/ui.js?v=4"></script>
<script>
  document.body.insertAdjacentHTML('afterbegin', UI.banner());
  UI.wireTheme();
  document.querySelector('[data-demo-reset]').addEventListener('click', () => {
    Store.reset();
    window.location.href = 'index.html';
  });

  document.getElementById('registerForm').addEventListener('submit', (event) => {
    event.preventDefault();
    const result = Store.register({
      firstName: document.getElementById('firstName').value.trim(),
      lastName: document.getElementById('lastName').value.trim(),
      email: document.getElementById('email').value.trim(),
      password: document.getElementById('password').value,
      confirmPassword: document.getElementById('confirmPassword').value,
    });
    if (!result.ok) {
      UI.flash('#flash', 'error', result.error);
      return;
    }
    Store.setFlash('success', 'Welcome, ' + result.user.firstName + '. Your account is ready.');
    window.location.href = 'dashboard.html';
  });
</script>
</body>
</html>
