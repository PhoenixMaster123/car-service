name: Java CI - Build, Lint, and Test (Maven)

# Triggers the workflow on push or pull request events for main and any release branch.
on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

jobs:
  build-lint-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      # 1. Check out your repository's code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # This matches your original GIT_SUBMODULE_STRATEGY
          submodules: 'recursive'

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # Cache Maven packages for faster builds
          cache: 'maven'

      - name: Run Lint and Tests
        run: mvn -Dspring.profiles.active=ci checkstyle:check clean test

      # 4. Upload JUnit test reports
      - name: Upload Test Reports
        if: always() # Run this even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          # This is the default Maven path for test reports
          path: target/surefire-reports/*.xml

      # 5. Upload Checkstyle report (This is your request)
      # This step will ONLY run if the build fails (e.g., linting fails)
      - name: Upload Checkstyle Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          # This is the default Maven path for the Checkstyle report
          path: target/site/checkstyle.html
