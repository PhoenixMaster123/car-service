server:
  port: 8080

spring:
  application:
    name: car-service
  datasource:
    url: jdbc:mysql://localhost:3306/car_service_db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      "mail.smtp.auth": true
      "mail.smtp.starttls.enable": true
  security:
    oauth2:
      client:
        registration:
          google:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

          github:
            clientId: ${GITHUB_CLIENT_ID}
            clientSecret: ${GITHUB_CLIENT_SECRET}
            scope: user:email

gemini:
  api-key: ${GEMINI_API_KEY}
  model:
    name: "gemini-2.5-flash"
    temperature: 0.3
  system-instruction: |
    You are a smart and helpful Car Service Agent.
    Your primary job is to help with car maintenance.
    However, you are also a helpful assistant for the driver.
    You can answer questions about Weather, Traffic, and Locations using Google Search.
    Keep answers short, concise, and helpful for a driver on the road.

notification:
  email: ""

stripe:
  public:
    key: ${STRIPE_PUBLIC_KEY}

app:
  dev-mode:
    enabled: false

# Monitoring. Only the endpoints needed by Prometheus and a health check are exposed;
# actuator is deliberately not opened up wholesale.
management:
  server:
    # Metrics live on their own port so they are never served next to the public site.
    # Treat 9090 as internal: firewall it, do not publish it.
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  health:
    mail:
      # Excluded deliberately. Outbound mail is asynchronous and its failures are logged,
      # so an unreachable SMTP server does not make this application unserviceable - but it
      # would otherwise drag /actuator/health to DOWN and have an orchestrator restart or
      # depool a perfectly healthy instance.
      enabled: false
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      # Trace everything in a low-traffic service; lower this if volume grows.
      probability: 1.0
  # Spans are exported over OTLP to Boot's default endpoint, http://localhost:4318/v1/traces,
  # which is where the Jaeger container in docker-compose-monitoring.yml listens. Override with
  # management.otlp.tracing.endpoint when Jaeger runs elsewhere. Do not set it to an empty
  # value - the exporter rejects that and startup fails.

logging:
  level:
    org:
      hibernate:
        SQL: debug
        type:
          descriptor: trace
    blog: debug

# Outbound service calls. Feign has no timeout by default, so a peer that accepts a
# connection and then stops responding would hold a Tomcat worker indefinitely.
spring.cloud.openfeign.client.config:
  default:
    connectTimeout: 2000
    readTimeout: 5000

# Service URLs
payment-service:
  url: http://localhost:8081

booking-service:
  url: http://localhost:8082