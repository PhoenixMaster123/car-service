server:
  port: 8080

spring:
  application:
    name: car-service
  datasource:
    url: jdbc:mysql://localhost:3306/car_service_db?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  mvc:
    hiddenmethod:
      filter:
        enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      "mail.smtp.auth": true
      "mail.smtp.starttls.enable": true

gemini:
  api-key: ${GEMINI_API_KEY}
  model:
    name: "gemini-2.5-flash"
    temperature: 0.3
  system-instruction: |
    You are a smart and helpful Car Service Agent.
    Your primary job is to help with car maintenance.
    However, you are also a helpful assistant for the driver.
    You can answer questions about Weather, Traffic, and Locations using Google Search.
    Keep answers short, concise, and helpful for a driver on the road.
            

notification:
  email: ""

stripe:
  public:
    key: ${STRIPE_PUBLIC_KEY}

logging:
  level:
    org:
      hibernate:
        SQL: debug
        type:
          descriptor: trace
    blog: debug

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
  info:
    title: "Car Service REST API"
    version: "1.0.0"
    description: |
      Welcome to the Car Service REST API documentation.
      Most endpoints can be executed by using the 'Try it out' function.
      Please be careful with this function on production environments.
    contact:
      name: "Your Company Name"
      url: "https://harisauto.com"
      email: "harisauto@gmail.com"


payment-service:
  url: http://localhost:8081