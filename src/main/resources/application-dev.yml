spring:
  datasource:
    url: jdbc:h2:file:./data/testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: localhost
    port: 1025
    properties:
      "mail.smtp.auth": false
      "mail.smtp.starttls.enable": false
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

notification:
  email: "harisauto@gmail.com"