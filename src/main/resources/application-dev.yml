spring:
  datasource:
    url: jdbc:h2:file:./data/testdb
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      "mail.smtp.auth": false
      "mail.smtp.starttls.enable": false
  security:
    oauth2:
      client:
        registration:
          google:
            clientId: dummy-google-client-id
            clientSecret: dummy-google-client-secret
          github:
            clientId: dummy-github-client-id
            clientSecret: dummy-github-client-secret

  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis

# Placeholder credentials so the dev profile boots without real secrets.
# These are top-level keys: GeminiConfig reads ${gemini.api-key} and
# PaymentController reads ${stripe.public.key} - neither lives under "spring".
gemini:
  api-key: dummy-gemini-key

stripe:
  public:
    key: dummy-stripe-key

notification:
  email: "harisauto@gmail.com"

app:
  dev-mode:
    enabled: true