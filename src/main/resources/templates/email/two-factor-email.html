<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your sign-in code</title>
</head>
<body style="margin:0;padding:24px;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b">
<div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:10px;padding:32px">
    <h1 style="margin:0 0 12px;font-size:20px">Your sign-in code</h1>
    <p style="margin:0 0 24px;color:#52525b;font-size:15px;line-height:1.6">
        Enter this code to finish signing in to Haris Car Care.
    </p>
    <div style="font-size:34px;letter-spacing:10px;font-weight:bold;text-align:center;
                padding:18px;background:#f4f4f5;border-radius:8px" th:text="${code}">000000</div>
    <p style="margin:24px 0 0;color:#52525b;font-size:14px;line-height:1.6">
        It expires in <strong th:text="${expiryMinutes}">10</strong> minutes and can be used once.
    </p>
    <p style="margin:16px 0 0;color:#a1a1aa;font-size:13px;line-height:1.6">
        If you did not try to sign in, you can ignore this email — but consider changing your
        password, since somebody may know it.
    </p>
</div>
</body>
</html>
