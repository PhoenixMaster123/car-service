<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Verify sign-in - Haris Car Care</title>
    <th:block th:replace="~{fragments/head :: common-meta}"></th:block>
    <link th:href="@{/auth/auth-layout.css}" rel="stylesheet">
</head>
<body>

<div class="auth-container">
    <div class="auth-card">
        <h2>Check your email</h2>
        <p style="color:#666;margin-bottom:20px">
            We sent a six-digit code to your email address. Enter it below to finish signing in.
        </p>

        <div class="error-message" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/login/verify}" method="post">
            <div class="form-group">
                <label for="code">Verification code</label>
                <input type="text" id="code" name="code" required autofocus
                       inputmode="numeric" pattern="[0-9]{6}" maxlength="6"
                       autocomplete="one-time-code"
                       placeholder="000000"
                       style="letter-spacing:8px;text-align:center;font-size:20px">
            </div>

            <button type="submit" class="submit-btn">Verify</button>
        </form>

        <div class="auth-footer" style="margin-top:16px">
            <a th:href="@{/login}">Start again</a>
        </div>
    </div>
</div>

</body>
</html>
