<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Register - Haris Car Care</title>
    <th:block th:replace="~{fragments/head :: common-meta}"></th:block>
    <link th:href="@{/auth/auth-layout.css}" rel="stylesheet">
</head>
<body>

<div class="standalone-theme-toggle theme-toggle" id="theme-toggle">
    <i class="fa-solid fa-sun"></i>
    <i class="fa-solid fa-moon"></i>
    <div class="toggle-circle"></div>
</div>

<main class="auth-wrapper">
    <div class="auth-container">
        <a th:href="@{/}" class="brand-name">Haris Car Care</a>
        <h2>Create Account</h2>

        <form th:action="@{/register}" th:method="POST" th:object="${registerRequest}" id="registerForm">

            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" th:field="*{firstName}" required>
                    <div class="error-message" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" th:field="*{lastName}" required>
                    <div class="error-message" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" required>
                <div class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" required>
                <div class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required>
                <div class="error-message" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree with the <a href="/terms-of-service">Terms &amp; Conditions</a></label>
            </div>

            <button type="submit" class="submit-btn">Register</button>

            <div class="auth-switch-link">
                Already have an account?
                <a th:href="@{/login}">Sign In</a>
            </div>
        </form>
    </div>
</main>

<script th:src="@{/component/theme-toggle/toggleSwitch.js}"></script>
</body>
</html>
