<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Haris Car Care</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
    <link th:href="@{/css/common/base.css}" rel="stylesheet">
    <link th:href="@{/css/common/variables.css}" rel="stylesheet">
    <link th:href="@{/css/auth/auth-layout.css}" rel="stylesheet">
</head>
<body>

<div class="standalone-theme-toggle theme-toggle" id="theme-toggle">
    <i class="fa-solid fa-sun"></i>
    <i class="fa-solid fa-moon"></i>
    <div class="toggle-circle"></div>
</div>

<main class="auth-wrapper">
    <div class="auth-container">
        <a th:href="@{/}" class="brand-name">Haris Car Care</a>
        <h2>Sign In</h2>

        <div th:if="${param.error}" class="error-message">Invalid email or password.</div>

        <div th:if="${param.logout}" class="success-message"> You have been logged out.</div>

        <form th:action="@{/login}" th:method="POST" th:object="${loginRequest}">

            <div class="form-group">
                <label for="username">Email</label>
                <input type="email" id="username" name="username" th:field="*{email}" required>
                <i class="fa-solid fa-envelope input-icon"></i>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <i class="fa-solid fa-lock input-icon"></i>
            </div>

            <div class="form-helpers">
                <div class="checkbox-group">
                    <input type="checkbox" id="remember-me" name="remember-me">
                    <label for="remember-me">Remember me</label>
                </div>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn">Login</button>

            <div class="auth-switch-link">
                Don't have an account?
                <a th:href="@{/register}">Register</a>
            </div>
        </form>
    </div>
</main>
<script src="/js/toggleSwitch.js"></script>
</body>
</html>
