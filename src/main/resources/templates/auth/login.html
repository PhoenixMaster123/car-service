<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Sign In - Haris Car Care</title>
    <th:block th:replace="~{fragments/head :: common-meta}"></th:block>
    <link th:href="@{/auth/auth-layout.css}" rel="stylesheet">
</head>
<body>

<div class="standalone-theme-toggle theme-toggle" id="theme-toggle">
    <i class="fa-solid fa-sun"></i>
    <i class="fa-solid fa-moon"></i>
    <div class="toggle-circle"></div>
</div>

<main class="auth-wrapper">
    <div class="auth-container">
        <a th:href="@{/}" class="brand-name">Haris Car Care</a>
        <h2>Sign In</h2>

        <div th:if="${param.error}" class="alert alert-error">Invalid email or password.</div>
        <div th:if="${param.logout}" class="alert alert-success">You have been logged out.</div>

        <form th:action="@{/login}" th:method="POST" th:object="${loginRequest}">

            <div class="form-group">
                <label for="username">Email</label>
                <input type="email" id="username" name="username" th:field="*{email}" required>
                <i class="fa-solid fa-envelope input-icon"></i>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
                <i class="fa-solid fa-lock input-icon"></i>
            </div>

            <div class="form-helpers">
                <div class="checkbox-group">
                    <input type="checkbox" id="remember-me" name="remember-me">
                    <label for="remember-me">Remember me</label>
                </div>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn">Login</button>

            <div class="auth-switch-link">
                Don't have an account?
                <a th:href="@{/register}">Register</a>
            </div>
        </form>

        <div class="social-login-separator">
            <span>OR</span>
        </div>

        <div class="social-buttons">
            <a href="/oauth2/authorization/google" class="social-btn google">
                <i class="fa-brands fa-google"></i> Continue with Google
            </a>
            <a href="/oauth2/authorization/github" class="social-btn github">
                <i class="fa-brands fa-github"></i> Continue with GitHub
            </a>
        </div>
    </div>
</main>

<script th:src="@{/component/theme-toggle/toggleSwitch.js}"></script>
</body>
</html>
