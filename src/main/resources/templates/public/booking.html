<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Book Appointment - Haris Car Care</title>
    <th:block th:replace="~{fragments/head :: common-meta}"></th:block>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link th:href="@{/component/navbar/navbar.css}" rel="stylesheet">
    <link th:href="@{/component/footer/footer.css}" rel="stylesheet">
    <link th:href="@{/component/chatbot/chatbot.css}" rel="stylesheet">
    <link th:href="@{/public/booking/booking.css}" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<main class="page-container">
    <div class="booking-container">

        <!-- Step Progress Indicator -->
        <div class="step-progress">
            <div class="step completed">
                <div class="step-circle"><i class="fa-solid fa-list-check"></i></div>
                <span class="step-label">Services</span>
            </div>
            <div class="step-line completed-line"></div>
            <div class="step active">
                <div class="step-circle"><i class="fa-solid fa-calendar-check"></i></div>
                <span class="step-label">Details</span>
            </div>
            <div class="step-line"></div>
            <div class="step">
                <div class="step-circle"><i class="fa-solid fa-credit-card"></i></div>
                <span class="step-label">Payment</span>
            </div>
        </div>

        <h1><i class="fa-solid fa-calendar-check"></i> Book Your Appointment</h1>

        <!-- Flash Messages -->
        <div th:if="${error}" class="alert alert-error">
            <i class="fa-solid fa-circle-exclamation"></i>
            <span th:text="${error}">Error message</span>
        </div>
        <div th:if="${success}" class="alert alert-success">
            <i class="fa-solid fa-circle-check"></i>
            <span th:text="${success}">Success message</span>
        </div>

        <div class="form-group">
            <label><i class="fa-solid fa-list-check"></i> Selected Services <span style="color:var(--primary)">*</span></label>

            <div class="selected-services-box">
                <div th:if="${cart == null or cart.count == 0}" class="empty-cart-state">
                    <i class="fa-solid fa-basket-shopping"></i>
                    <p>No services selected yet.</p>
                </div>

                <div th:if="${cart != null and cart.count > 0}">
                    <div th:each="item : ${cart.items}" class="service-item-row">
                        <div class="service-item-info">
                            <span class="service-name" th:text="${item.name}">Premium Wash</span>
                            <span class="service-price" th:text="'€' + ${#numbers.formatDecimal(item.basePrice, 1, 2)}">€25.00</span>
                        </div>
                        <form th:action="@{/cart/remove/{id}(id=${item.id})}" method="post" style="margin:0;">
                            <input type="hidden" name="redirect" value="/bookings">
                            <button type="submit" class="btn-remove-item" title="Remove">
                                <i class="fa-solid fa-times"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="price-summary" th:if="${cart != null and cart.count > 0}">
                <span>Total Estimate:</span>
                <span class="total-amount" th:text="'€' + ${#numbers.formatDecimal(cart.total, 1, 2)}">€0.00</span>
            </div>

            <button type="button" class="btn-select-services" onclick="window.location.href='/services'">
                <i class="fa-solid fa-plus"></i>
                <span th:text="${cart != null and cart.count > 0 ? 'Add More Services' : 'Browse Service Menu'}">Browse</span>
            </button>
        </div>

        <form id="bookingForm" th:action="@{/bookings}" th:method="POST" th:object="${bookingFormRequest}">

            <div class="form-row">
                <div class="form-group">
                    <label for="bookingDate"><i class="fa-solid fa-calendar-days"></i> Date &amp; Time *</label>
                    <input type="datetime-local" id="bookingDate" name="bookingDate" required th:field="*{bookingDate}">
                    <span class="error-msg" th:if="${#fields.hasErrors('bookingDate')}" th:errors="*{bookingDate}"></span>
                </div>

                <div class="form-group">
                    <label for="vehicle"><i class="fa-solid fa-car"></i> Vehicle *</label>
                    <select id="vehicle" name="vehicleId" required>
                        <option value="" disabled selected>Select Car</option>
                        <option th:each="vehicle : ${vehicles}"
                                th:value="${vehicle.id}"
                                th:text="|${vehicle.make} ${vehicle.model} (${vehicle.licensePlate})|"
                                th:field="*{vehicleId}">
                        </option>
                    </select>
                    <span class="error-msg" th:if="${#fields.hasErrors('vehicleId')}" th:errors="*{vehicleId}"></span>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group" id="phoneGroup">
                    <label for="phoneNumber"><i class="fa-solid fa-phone"></i> Phone Number *</label>
                    <input type="tel" id="phoneNumber" name="phoneNumber" placeholder="+49 151 1234567" required th:field="*{phoneNumber}">
                    <span class="error-msg" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></span>
                </div>

                <div class="form-group">
                    <label for="paymentMethod"><i class="fa-solid fa-credit-card"></i> Payment *</label>
                    <select id="paymentMethod" name="paymentMethod" required onchange="updateSubmitButton()" th:field="*{paymentMethod}">
                        <option value="" disabled selected>Method</option>
                        <option value="CASH">Cash on Arrival</option>
                        <option value="CARD">Credit / Debit Card</option>
                        <option value="PAYPAL">PayPal</option>
                    </select>
                    <span class="error-msg" th:if="${#fields.hasErrors('paymentMethod')}" th:errors="*{paymentMethod}"></span>
                </div>
            </div>

            <div class="form-group">
                <small><i class="fa-solid fa-lock security-icon"></i> Your contact details are secure and encrypted.</small>
            </div>

            <div class="form-group">
                <label for="notes"><i class="fa-solid fa-comment"></i> Special Instructions</label>
                <textarea id="notes" name="notes" rows="3" placeholder="Gate code, specific scratches to look at, etc..." th:field="*{additionalNotes}"></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="btnText">Confirm Booking</span>
                <i id="btnIcon" class="fa-solid fa-arrow-right submit-icon"></i>
            </button>
        </form>

        <div id="message"></div>
    </div>
</main>

<footer th:replace="~{fragments/footer :: site-footer}"></footer>
<th:block th:replace="~{fragments/footer :: chatbot-widget}"></th:block>
<th:block th:replace="~{fragments/footer :: common-scripts}"></th:block>
<script th:src="@{/public/booking/booking.js}"></script>
</body>
</html>
