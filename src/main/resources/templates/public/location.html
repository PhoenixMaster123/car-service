<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Location - Haris Car Care</title>
    <th:block th:replace="~{fragments/head :: common-meta}"></th:block>
    <link th:href="@{/component/navbar/navbar.css}" rel="stylesheet">
    <link th:href="@{/component/footer/footer.css}" rel="stylesheet">
    <link th:href="@{/component/chatbot/chatbot.css}" rel="stylesheet">
    <link th:href="@{/public/location/location.css}" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<header>
    <h1>Our <span>Location</span></h1>
    <p>Come visit us. We're open 7 days a week.</p>
</header>

<main class="sp-wrapper">

    <section class="content-card">
        <h2><i class="fa-solid fa-map-marked-alt"></i> Find Us on the Map</h2>
        <p class="section-description">We are conveniently located in Ruse.</p>
        <iframe class="map-embed"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d46067.8282361771!2d25.92723758656114!3d43.84373145116787!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x40ae60b69171587f%3A0x400a01269bf5a60!2sRuse%2C%20Bulgaria!5e0!3m2!1sen!2sde!4v1729690000000!5m2!1sen!2sde"
                loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </section>

    <section class="content-card">
        <h2><i class="fa-solid fa-circle-info"></i> Shop Details</h2>
        <div class="location-grid">
            <div class="info-card">
                <h3><i class="fa-solid fa-location-dot"></i> Address</h3>
                <p>Maria Luiza Blvd<br>Ruse, Bulgaria</p>
            </div>
            <div class="info-card">
                <h3><i class="fa-solid fa-clock"></i> Hours</h3>
                <p>Mon–Sat: 08:00 – 19:00<br>Sun: 10:00 – 16:00</p>
            </div>
            <div class="info-card">
                <h3><i class="fa-solid fa-phone"></i> Contact</h3>
                <p><a href="tel:+3590000000">+359 00 000 000</a><br>
                   <a href="mailto:harisauto@gmail.com">harisauto@gmail.com</a></p>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/footer :: site-footer}"></footer>
<th:block th:replace="~{fragments/footer :: chatbot-widget}"></th:block>
<th:block th:replace="~{fragments/footer :: common-scripts}"></th:block>
</body>
</html>
