<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>News - Haris Car Care</title>
    <th:block th:replace="~{fragments/head :: common-meta}"></th:block>
    <link th:href="@{/component/navbar/navbar.css}" rel="stylesheet">
    <link th:href="@{/component/footer/footer.css}" rel="stylesheet">
    <link th:href="@{/component/chatbot/chatbot.css}" rel="stylesheet">
    <link th:href="@{/public/news/news.css}" rel="stylesheet">
</head>
<body>

<nav th:replace="~{fragments/navbar :: navbar}"></nav>

<header>
    <h1>Latest <span>News</span></h1>
</header>

<main class="sp-wrapper">

    <section class="content-card">
        <h2><i class="fa-solid fa-newspaper"></i> What's New</h2>
        <p class="section-description">Updates on our equipment, products, and services.</p>

        <div class="articles-grid" th:if="${newsList != null and !newsList.isEmpty()}">
            <article class="article-card" th:each="item : ${newsList}">
                <img th:if="${item.imageUrl != null}" th:src="@{${item.imageUrl}}"
                     th:alt="${item.title}">
                <video th:if="${item.imageUrl == null and item.videoUrl != null}"
                       th:src="@{${item.videoUrl}}" controls preload="metadata"
                       style="width:100%;display:block;"></video>
                <div class="content">
                    <h3 th:text="${item.title}">Title</h3>
                    <div class="meta">
                        <span th:text="${#temporals.format(item.dateCreated, 'd MMM yyyy')}">Date</span>
                        <span th:if="${item.author != null}" th:text="' • ' + ${item.author}"></span>
                    </div>
                    <p th:text="${item.content}">Content</p>
                    <video th:if="${item.imageUrl != null and item.videoUrl != null}"
                           th:src="@{${item.videoUrl}}" controls preload="metadata"
                           style="width:100%;margin-top:12px;"></video>
                </div>
            </article>
        </div>

        <p class="section-description" th:if="${newsList == null or newsList.isEmpty()}">
            There are no news articles yet. Check back soon.
        </p>

    </section>

    <section class="content-card">
        <h2><i class="fa-solid fa-video"></i> Carpet Machine in Action</h2>
        <p class="section-description">See how our deep extraction machine brings carpets back to life.</p>
        <iframe class="video-embed" src="https://harisauto.net/wp-content/uploads/2022/08/123-video-converter.com-1.mp4" title="Carpet machine demo" loading="lazy" allowfullscreen></iframe>
    </section>
</main>

<footer th:replace="~{fragments/footer :: site-footer}"></footer>
<th:block th:replace="~{fragments/footer :: chatbot-widget}"></th:block>
<th:block th:replace="~{fragments/footer :: common-scripts}"></th:block>
</body>
</html>
