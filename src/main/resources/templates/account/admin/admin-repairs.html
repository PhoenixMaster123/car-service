<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Repairs - Haris Car Care</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link th:href="@{/common/base.css}" rel="stylesheet">
    <link th:href="@{/common/variables.css}" rel="stylesheet">
    <link th:href="@{/component/admin-sidebar/admin-sidebar.css}" rel="stylesheet">
    <link th:href="@{/component/navbar/navbar.css}" rel="stylesheet">
    <link th:href="@{/component/chatbot/chatbot.css}" rel="stylesheet">
    <link th:href="@{/account/admin/repairs/admin-repairs.css}" rel="stylesheet">
</head>
<body>
<div class="dashboard">
    <aside class="sidebar">
        <a href="/" class="sidebar-brand">Haris Car Care</a>

        <ul class="sidebar-nav">
            <li><a href="/admin/dashboard"><i class="fa-solid fa-gauge-high"></i> Dashboard</a></li>
            <li><a href="/admin/users"><i class="fa-solid fa-users"></i> Users</a></li>
            <li><a href="/admin/services"><i class="fa-solid fa-car"></i> Services</a></li>
            <li><a href="/admin/bookings"><i class="fa-solid fa-calendar-check"></i> Bookings</a></li>
            <li><a href="/admin/repairs" class="active"><i class="fa-solid fa-screwdriver-wrench"></i> Repairs</a></li>
            <li><a href="/admin/reports"><i class="fa-solid fa-chart-line"></i> Reports</a></li>
            <li><a href="/admin/settings"><i class="fa-solid fa-gear"></i> Settings</a></li>
            <li><a th:href="@{/}"><i class="fa-solid fa-house"></i> Back to Site</a></li>
            <li><a href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        </ul>

        <div class="sidebar-footer">
            <div class="theme-toggle" id="theme-toggle">
                <i class="fa-solid fa-sun"></i>
                <i class="fa-solid fa-moon"></i>
                <div class="toggle-circle"></div>
            </div>
        </div>
    </aside>
</div>
<button class="chat-toggle" id="chat-toggle" aria-label="Toggle Chat">
    <i class="fa-solid fa-comment-dots" id="chat-icon-open"></i>
    <i class="fa-solid fa-xmark" id="chat-icon-close"></i>
</button>

<div class="chat-widget" id="chat-widget">
    <div class="chat-header">
        <h3>Haris AI Assistant</h3>
        <button class="chat-close-btn" id="chat-close-btn" aria-label="Close Chat">&times;</button>
    </div>
    <div class="chat-body" id="chat-body">
        <div class="chat-message bot">
            <p>Hello! How can I help you with your car care questions today?</p>
        </div>
    </div>
    <form class="chat-footer" id="chat-form">
        <input type="text" id="chat-input" placeholder="Ask a question..." autocomplete="off">
        <button type="submit" aria-label="Send Message"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
</div>
</body>
<script th:src="@{/component/theme-toggle/toggleSwitch.js}"></script>
<script th:src="@{/component/navbar/navbarMobileView.js}"></script>
<script th:src="@{/component/chatbot/chatbot.js}"></script>
</html>
