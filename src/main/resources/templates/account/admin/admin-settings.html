<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Admin Settings - Haris Car Care</title>
    <th:block th:replace="~{fragments/head :: common-meta}"></th:block>
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    <link th:href="@{/component/admin-sidebar/admin-sidebar.css}" rel="stylesheet">
    <link th:href="@{/component/navbar/navbar.css}" rel="stylesheet">
    <link th:href="@{/component/chatbot/chatbot.css}" rel="stylesheet">
    <link th:href="@{/account/admin/settings/admin-settings.css}" rel="stylesheet">
</head>
<body>

<div class="dashboard">
    <aside th:replace="~{fragments/admin-sidebar :: admin-sidebar('settings')}"></aside>

    <main class="dashboard-content">
        <h1>Admin Settings</h1>

        <div th:if="${successMessage}" class="alert alert-success">
            <i class="fa-solid fa-check-circle"></i>
            <span th:text="${successMessage}"></span>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error">
            <i class="fa-solid fa-exclamation-circle"></i>
            <span th:text="${errorMessage}"></span>
        </div>

        <div class="settings-section">
            <h2><i class="fa-solid fa-user"></i> Account Settings</h2>

            <div class="settings-card">
                <div class="card-header">
                    <h3><i class="fa-solid fa-envelope"></i> Change Email</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/settings/email}" th:method="PUT" th:object="${adminChangeEmailRequest}">
                        <div class="form-group">
                            <label for="currentEmail">Current Email</label>
                            <input type="email" id="currentEmail" class="form-input" th:value="${user.email}" readonly>
                        </div>
                        <div class="form-group">
                            <label for="newEmail">New Email</label>
                            <input type="email" id="newEmail" class="form-input" th:field="*{newEmail}" required>
                            <span class="error-message" th:if="${#fields.hasErrors('newEmail')}" th:errors="*{newEmail}"></span>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-save"></i> Update Email
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="settings-card">
                <div class="card-header">
                    <h3><i class="fa-solid fa-key"></i> Change Password</h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/settings/password}" th:method="PUT" th:object="${adminChangePasswordRequest}">
                        <div class="form-group">
                            <label for="currentPassword">Current Password</label>
                            <div class="input-wrapper">
                                <input type="password" id="currentPassword" class="form-input" th:field="*{currentPassword}" required>
                                <button type="button" class="password-toggle" data-target="currentPassword">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                            <span class="error-message" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
                        </div>
                        <div class="form-group">
                            <label for="newPassword">New Password</label>
                            <div class="input-wrapper">
                                <input type="password" id="newPassword" class="form-input" th:field="*{newPassword}" required>
                                <button type="button" class="password-toggle" data-target="newPassword">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                            <span class="error-message" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
                        </div>
                        <div class="form-group">
                            <label for="confirmNewPassword">Confirm New Password</label>
                            <div class="input-wrapper">
                                <input type="password" id="confirmNewPassword" class="form-input" th:field="*{confirmNewPassword}" required>
                                <button type="button" class="password-toggle" data-target="confirmNewPassword">
                                    <i class="fa-solid fa-eye"></i>
                                </button>
                            </div>
                            <span class="error-message" th:if="${#fields.hasErrors('confirmNewPassword')}" th:errors="*{confirmNewPassword}"></span>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary">
                                <i class="fa-solid fa-save"></i> Update Password
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/footer :: chatbot-widget}"></th:block>
<script th:src="@{/account/settings/password.js}"></script>
<th:block th:replace="~{fragments/footer :: common-scripts}"></th:block>

</body>
</html>
