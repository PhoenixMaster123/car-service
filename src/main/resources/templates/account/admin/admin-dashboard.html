<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>Admin Dashboard - Haris Car Care</title>
    <th:block th:replace="~{fragments/head :: common-meta}"></th:block>
    <link th:href="@{/component/admin-sidebar/admin-sidebar.css}" rel="stylesheet">
    <link th:href="@{/component/navbar/navbar.css}" rel="stylesheet">
    <link th:href="@{/component/chatbot/chatbot.css}" rel="stylesheet">
    <link th:href="@{/account/admin/dashboard/admin-dashboard.css}" rel="stylesheet">
</head>
<body>

<div class="dashboard">
    <aside th:replace="~{fragments/admin-sidebar :: admin-sidebar('dashboard')}"></aside>

    <main class="dashboard-content">
        <h1>Dashboard Overview</h1>

        <div class="card-grid">
            <div class="dashboard-card">
                <div class="icon"><i class="fa-solid fa-users"></i></div>
                <h3>Total Users</h3>
                <p class="value" th:text="${allUsers.size()}">1,287</p>
                <p class="description">+15 This month</p>
            </div>
            <div class="dashboard-card">
                <div class="icon"><i class="fa-solid fa-euro-sign"></i></div>
                <h3>Monthly Revenue</h3>
                <p class="value">€8,450</p>
                <p class="description">+5.2% vs last month</p>
            </div>
            <div class="dashboard-card">
                <div class="icon"><i class="fa-solid fa-calendar-day"></i></div>
                <h3>Bookings Today</h3>
                <p class="value">32</p>
                <p class="description">Avg. €25 per booking</p>
            </div>
            <div class="dashboard-card">
                <div class="icon"><i class="fa-solid fa-clock"></i></div>
                <h3>Pending Repairs</h3>
                <p class="value">8</p>
                <p class="description">2 Overdue</p>
            </div>
        </div>

        <div class="chart-grid">
            <div class="chart-container">
                <h3>Revenue Over Time</h3>
                <div class="chart-wrapper">
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>
            <div class="chart-container">
                <h3>Service Popularity</h3>
                <div class="chart-wrapper">
                    <canvas id="serviceChart"></canvas>
                </div>
            </div>
        </div>
    </main>
</div>

<th:block th:replace="~{fragments/footer :: chatbot-widget}"></th:block>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<th:block th:replace="~{fragments/footer :: common-scripts}"></th:block>
<script>
    Chart.defaults.color = getComputedStyle(document.documentElement).getPropertyValue('--text-color');
    Chart.defaults.borderColor = getComputedStyle(document.documentElement).getPropertyValue('--border-color');

    const revenueCtx = document.getElementById('revenueChart');
    const revenueChart = new Chart(revenueCtx, {
        type: 'line',
        data: {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'],
            datasets: [{
                label: 'Revenue (€)',
                data: [6200, 7100, 6800, 8500, 9200, 8800, 10100, 9800, 11200, 10800, 12400, 11800],
                borderColor: getComputedStyle(document.documentElement).getPropertyValue('--primary'),
                backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--primary') + '20',
                borderWidth: 3,
                fill: true,
                tension: 0.4,
                pointRadius: 5,
                pointHoverRadius: 7,
                pointBackgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--primary'),
                pointBorderColor: '#fff',
                pointBorderWidth: 2
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: true,
                    position: 'top',
                    labels: {
                        color: getComputedStyle(document.documentElement).getPropertyValue('--text-color'),
                        font: { family: 'Poppins', size: 12 }
                    }
                },
                tooltip: {
                    backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--inner-card-bg'),
                    titleColor: getComputedStyle(document.documentElement).getPropertyValue('--text-color'),
                    bodyColor: getComputedStyle(document.documentElement).getPropertyValue('--text-color'),
                    borderColor: getComputedStyle(document.documentElement).getPropertyValue('--border-color'),
                    borderWidth: 1,
                    padding: 12,
                    displayColors: true
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        color: getComputedStyle(document.documentElement).getPropertyValue('--text-color-muted'),
                        callback: function(value) { return '€' + value.toLocaleString(); }
                    },
                    grid: { color: getComputedStyle(document.documentElement).getPropertyValue('--border-color') }
                },
                x: {
                    ticks: { color: getComputedStyle(document.documentElement).getPropertyValue('--text-color-muted') },
                    grid: { color: getComputedStyle(document.documentElement).getPropertyValue('--border-color') }
                }
            }
        }
    });

    const serviceCtx = document.getElementById('serviceChart');
    const serviceChart = new Chart(serviceCtx, {
        type: 'doughnut',
        data: {
            labels: ['Oil Change', 'Brake Service', 'Tire Rotation', 'Engine Repair', 'AC Service', 'Other'],
            datasets: [{
                data: [35, 22, 18, 12, 8, 5],
                backgroundColor: [
                    getComputedStyle(document.documentElement).getPropertyValue('--primary'),
                    getComputedStyle(document.documentElement).getPropertyValue('--secondary'),
                    getComputedStyle(document.documentElement).getPropertyValue('--accent'),
                    '#ff6b6b', '#4ecdc4', '#95a5a6'
                ],
                borderWidth: 2,
                borderColor: getComputedStyle(document.documentElement).getPropertyValue('--inner-card-bg')
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: true,
                    position: 'bottom',
                    labels: {
                        color: getComputedStyle(document.documentElement).getPropertyValue('--text-color'),
                        font: { family: 'Poppins', size: 11 },
                        padding: 15,
                        usePointStyle: true
                    }
                },
                tooltip: {
                    backgroundColor: getComputedStyle(document.documentElement).getPropertyValue('--inner-card-bg'),
                    titleColor: getComputedStyle(document.documentElement).getPropertyValue('--text-color'),
                    bodyColor: getComputedStyle(document.documentElement).getPropertyValue('--text-color'),
                    borderColor: getComputedStyle(document.documentElement).getPropertyValue('--border-color'),
                    borderWidth: 1,
                    padding: 12,
                    callbacks: {
                        label: function(context) { return context.label + ': ' + context.parsed + '%'; }
                    }
                }
            }
        }
    });

    const themeToggle = document.getElementById('theme-toggle');
    if (themeToggle) {
        themeToggle.addEventListener('click', function() {
            setTimeout(() => { revenueChart.update(); serviceChart.update(); }, 300);
        });
    }
</script>

</body>
</html>
