<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage News - Admin - Haris Car Care</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link th:href="@{/css/common/base.css}" rel="stylesheet">
    <link th:href="@{/css/common/variables.css}" rel="stylesheet">
    <link th:href="@{/component/admin-sidebar/admin-sidebar.css}" rel="stylesheet">
    <link th:href="@{/component/theme-toggle/theme-toggle.css}" rel="stylesheet">
    <link th:href="@{/component/chatbot/chatbot.css}" rel="stylesheet">
    <!-- Inline styles for quick layout of news -->
    <style>
        .dashboard-content {
            padding: 2rem;
            margin-left: var(--sidebar-width);
            width: calc(100% - var(--sidebar-width));
        }
        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .btn-primary {
            background-color: var(--primary);
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }
        .news-card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid var(--border-color);
        }
        .news-card img, .news-card video {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .news-content {
            padding: 1rem;
        }
        .news-content h3 {
            margin-top: 0;
            color: var(--text-color);
        }
        .news-content p {
            color: var(--text-color-muted);
            font-size: 0.9rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .news-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 1rem;
        }
        .btn-danger {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 0.5rem;
            border-radius: 4px;
            cursor: pointer;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            color: var(--text-color);
        }
        .form-group {
            margin-bottom: 1rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
        }
        .form-control {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            background: var(--inner-card-bg);
            color: var(--text-color);
            border-radius: 4px;
        }
        .alert {
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 4px;
        }
        .alert-success { background-color: #dcfce7; color: #166534; }
        .alert-error { background-color: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>

<div class="dashboard">
    <aside class="sidebar">
        <a href="/" class="sidebar-brand">Haris Car Care</a>
        <ul class="sidebar-nav">
            <li><a href="/admin/dashboard"><i class="fa-solid fa-gauge-high"></i> Dashboard</a></li>
            <li><a href="/admin/users"><i class="fa-solid fa-users"></i> Users</a></li>
            <li><a href="/admin/services"><i class="fa-solid fa-car"></i> Services</a></li>
            <li><a href="/admin/bookings"><i class="fa-solid fa-calendar-check"></i> Bookings</a></li>
            <li><a href="/admin/repairs"><i class="fa-solid fa-screwdriver-wrench"></i> Repairs</a></li>
            <li><a href="/admin/reports"><i class="fa-solid fa-chart-line"></i> Reports</a></li>
            <li><a href="/admin/news" class="active"><i class="fa-solid fa-newspaper"></i> News</a></li>
            <li><a href="/admin/settings"><i class="fa-solid fa-gear"></i> Settings</a></li>
            <li><a th:href="@{/}"><i class="fa-solid fa-house"></i> Back to Site</a></li>
            <li><a href="/logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        </ul>
        <div class="sidebar-footer">
            <div class="theme-toggle" id="theme-toggle">
                <i class="fa-solid fa-sun"></i>
                <i class="fa-solid fa-moon"></i>
                <div class="toggle-circle"></div>
            </div>
        </div>
    </aside>

    <main class="dashboard-content">
        <div class="header-actions">
            <h1>Manage News</h1>
            <button class="btn-primary" onclick="document.getElementById('createModal').style.display='flex'">
                <i class="fa-solid fa-plus"></i> Create Article
            </button>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="news-grid">
            <div class="news-card" th:each="news : ${newsList}">
                <img th:if="${news.imageUrl != null}" th:src="@{${news.imageUrl}}" alt="News Image">
                <video th:if="${news.videoUrl != null}" th:src="@{${news.videoUrl}}" controls></video>
                <div class="news-content">
                    <h3 th:text="${news.title}">News Title</h3>
                    <small th:text="|By ${news.author} on ${#temporals.format(news.dateCreated, 'MMM dd, yyyy')}|">By admin on Jan 1</small>
                    <p th:text="${news.content}">Summary...</p>
                    <div class="news-actions">
                        <form th:action="@{/admin/news/delete}" method="post">
                            <input type="hidden" name="id" th:value="${news.id}"/>
                            <button type="submit" class="btn-danger" onclick="return confirm('Are you sure you want to delete this article?');">
                                <i class="fa-solid fa-trash"></i> Delete
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div th:if="${newsList.isEmpty()}" style="grid-column: 1 / -1; text-align: center; color: var(--text-color-muted); padding: 3rem;">
                <i class="fa-regular fa-newspaper fa-3x"></i>
                <p>No news articles published yet.</p>
            </div>
        </div>
    </main>
</div>

<!-- Create News Modal -->
<div id="createModal" class="modal">
    <div class="modal-content">
        <h2>Create News Article</h2>
        <form th:action="@{/admin/news/create}" method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="content">Content</label>
                <textarea id="content" name="content" class="form-control" rows="5" required></textarea>
            </div>
            <div class="form-group">
                <label for="image">Upload Image (Optional)</label>
                <input type="file" id="image" name="image" class="form-control" accept="image/*">
            </div>
            <div class="form-group">
                <label for="video">Upload Video (Optional)</label>
                <input type="file" id="video" name="video" class="form-control" accept="video/*">
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                <button type="button" class="btn-primary" style="background: #6b7280" onclick="document.getElementById('createModal').style.display='none'">Cancel</button>
                <button type="submit" class="btn-primary">Publish</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/component/theme-toggle/toggleSwitch.js}"></script>

</body>
</html>
