<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <title>My Bookings - Haris Car Care</title>
    <th:block th:replace="~{fragments/head :: common-meta}"></th:block>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link th:href="@{/component/navbar/navbar.css}" rel="stylesheet">
    <link th:href="@{/component/sidebar/sidebar.css}" rel="stylesheet">
    <link th:href="@{/component/chatbot/chatbot.css}" rel="stylesheet">
    <link th:href="@{/account/bookings/bookings.css}" rel="stylesheet">
</head>
<body>

<aside th:replace="~{fragments/sidebar :: sidebar('bookings')}"></aside>

<div class="main-content">
    <header class="page-header">
        <h1><i class="fa-solid fa-calendar-check"></i> My Bookings</h1>
    </header>

    <main class="page-container">

        <div class="content-card">
            <div class="card-header">
                <i class="fa-solid fa-hourglass-half" style="color: var(--primary);"></i>
                <h3>Upcoming Appointments</h3>
            </div>

            <div class="booking-list">

                <div th:if="${upcomingBookings.isEmpty()}" style="padding: 2rem; text-align: center; color: #666;">
                    <p>No upcoming appointments.</p>
                    <a th:href="@{/bookings}" class="btn btn-primary" style="margin-top: 10px;">Book Now</a>
                </div>

                <div class="booking-card" th:each="booking : ${upcomingBookings}">
                    <div class="booking-card-icon">
                        <i class="fa-solid fa-car"></i>
                    </div>
                    <div class="booking-card-details">
                        <h4 th:text="${booking.serviceNames}">Premium Wash</h4>
                        <p th:text="${booking.vehicleDescription}">Audi A4 (WUE-123)</p>
                    </div>
                    <div class="booking-card-datetime">
                        <span class="date" th:text="${#temporals.format(booking.bookingDate, 'MMM dd, yyyy')}">Date</span>
                        <span class="time" th:text="${#temporals.format(booking.bookingDate, 'HH:mm')}">Time</span>
                    </div>

                    <div class="booking-card-status"
                         th:classappend="${#strings.toString(booking.status) == 'PENDING' ? 'status-upcoming' : 'status-completed'}"
                         th:text="${booking.status}">
                        Upcoming
                    </div>

                    <div class="booking-card-actions">
                        <button class="booking-action-btn btn-secondary"
                                type="button"
                                th:data-id="'INV-' + ${booking.id}"
                                th:data-service="${booking.serviceNames}"
                                th:data-vehicle="${booking.vehicleDescription}"
                                th:data-date="${#temporals.format(booking.bookingDate, 'MMM dd, yyyy')}"
                                th:data-status="${booking.status}"
                                th:data-price="${booking.totalPrice}"
                                onclick="openInvoiceModal(this.getAttribute('data-id'), this.getAttribute('data-service'), this.getAttribute('data-vehicle'), this.getAttribute('data-date'), this.getAttribute('data-date'), this.getAttribute('data-status'), this.getAttribute('data-price'))">
                            <i class="fa-solid fa-file-invoice"></i> Invoice
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="content-card" style="margin-top: 2rem;">
            <div class="card-header">
                <i class="fa-solid fa-history" style="color: #666;"></i>
                <h3>Past Appointments</h3>
            </div>

            <div class="booking-list">

                <div th:if="${pastBookings.isEmpty()}" style="padding: 2rem; text-align: center; color: #666;">
                    <p>No past booking history.</p>
                </div>

                <div class="booking-card" th:each="booking : ${pastBookings}" style="opacity: 0.8;">
                    <div class="booking-card-icon" style="background: #e0e0e0; color: #666;">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <div class="booking-card-details">
                        <h4 th:text="${booking.serviceNames}">Service Name</h4>
                        <p th:text="${booking.vehicleDescription}">Vehicle</p>
                    </div>
                    <div class="booking-card-datetime">
                        <span class="date" th:text="${#temporals.format(booking.bookingDate, 'MMM dd, yyyy')}">Date</span>
                    </div>

                    <div class="booking-card-status status-completed" th:text="${booking.status}">Completed</div>

                    <div class="booking-card-actions">
                        <button class="booking-action-btn btn-primary">
                            <i class="fa-solid fa-rotate-right"></i> Book Again
                        </button>
                        <button class="booking-action-btn btn-secondary"
                                type="button"
                                th:data-id="'INV-' + ${booking.id}"
                                th:data-service="${booking.serviceNames}"
                                th:data-vehicle="${booking.vehicleDescription}"
                                th:data-date="${#temporals.format(booking.bookingDate, 'MMM dd, yyyy')}"
                                th:data-status="${#strings.toString(booking.status)}"
                                th:data-price="${booking.totalPrice}"
                                onclick="openInvoiceModal(this.getAttribute('data-id'), this.getAttribute('data-service'), this.getAttribute('data-vehicle'), this.getAttribute('data-date'), this.getAttribute('data-date'), this.getAttribute('data-status'), this.getAttribute('data-price'))">
                            <i class="fa-solid fa-file-invoice"></i> Invoice
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/invoice-modal :: invoice-modal}"></div>

<th:block th:replace="~{fragments/footer :: chatbot-widget}"></th:block>
<script th:src="@{/account/invoices/invoiceMenu.js}"></script>
<th:block th:replace="~{fragments/footer :: common-scripts}"></th:block>

</body>
</html>
