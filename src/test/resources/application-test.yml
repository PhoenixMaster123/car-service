spring:
  datasource:
    # In-memory and per-JVM, so the suite never touches the dev database in ./data
    # and can run while the application is up.
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

gemini:
  api-key: DUMMY_KEY_FOR_TESTS

stripe:
  public:
    key: DUMMY_KEY_FOR_TESTS